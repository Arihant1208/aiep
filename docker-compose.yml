# Local development stack. Synthetic data and local-only credentials (see .env.example).
#   Infrastructure only:   docker compose up -d
#   Infrastructure + apps: docker compose --profile app up -d --build   (migrator runs first, then api + worker)
name: aiep

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: aiep
      POSTGRES_USER: ${POSTGRES_SUPERUSER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:-postgres_local_dev}
      AIEP_MIGRATOR_PASSWORD: ${AIEP_MIGRATOR_PASSWORD:-migrator_local_dev}
      AIEP_API_PASSWORD: ${AIEP_API_PASSWORD:-api_local_dev}
      AIEP_WORKER_PASSWORD: ${AIEP_WORKER_PASSWORD:-worker_local_dev}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d aiep"]
      interval: 5s
      timeout: 3s
      retries: 20

  keycloak:
    # OIDC provider for local development (ADR-0016). Dev mode, in-memory store: the realm is re-imported on start.
    image: quay.io/keycloak/keycloak:26.8.2
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-keycloak_local_dev}
      # Tokens always say iss=http://localhost:8081/realms/aiep, even when containers fetch keys via keycloak:8080.
      KC_HOSTNAME: http://localhost:8081
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HEALTH_ENABLED: "true"
    ports:
      - "8081:8080"
    volumes:
      - ./deploy/keycloak:/opt/keycloak/data/import:ro
    healthcheck:
      # The image has no curl; talk HTTP to the management port directly.
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q UP <&3"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:3.34.0
    command: azurite-blob --blobHost 0.0.0.0 --loose
    ports:
      - "10000:10000"
    volumes:
      - azurite:/data

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.128.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./deploy/otel/collector.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "4317:4317"
      - "4318:4318"
    depends_on:
      - jaeger

  jaeger:
    image: jaegertracing/jaeger:2.7.0
    ports:
      - "16686:16686"

  prometheus:
    image: prom/prometheus:v3.4.1
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - otel-collector

  grafana:
    image: grafana/grafana:12.0.2
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
      - jaeger

  migrator:
    profiles: ["app"]
    build:
      context: .
      dockerfile: src/Aiep.Migrator/Dockerfile
    environment:
      # The only service that connects as the schema owner. It exits after applying migrations (ADR-0013).
      ConnectionStrings__AiepMigrator: Host=postgres;Database=aiep;Username=aiep_migrator;Password=${AIEP_MIGRATOR_PASSWORD:-migrator_local_dev}
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  api:
    profiles: ["app"]
    build:
      context: .
      dockerfile: src/Aiep.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Aiep: Host=postgres;Database=aiep;Username=aiep_api;Password=${AIEP_API_PASSWORD:-api_local_dev}
      Authentication__Oidc__Issuer: http://localhost:8081/realms/aiep
      Authentication__Oidc__MetadataAddress: http://keycloak:8080/realms/aiep/.well-known/openid-configuration
      Authentication__ApiKeys__Environment: dev
      Authentication__ApiKeys__Pepper: ${AIEP_API_KEY_PEPPER:-YWllcC1sb2NhbC1kZXYtcGVwcGVyLU5PVC1BLVNFQ1JFVC0wMDAx}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_SERVICE_NAME: aiep-api
    ports:
      - "8080:8080"
    depends_on:
      migrator:
        condition: service_completed_successfully
      keycloak:
        condition: service_healthy

  worker:
    profiles: ["app"]
    build:
      context: .
      dockerfile: src/Aiep.Worker/Dockerfile
    environment:
      DOTNET_ENVIRONMENT: Development
      ConnectionStrings__Aiep: Host=postgres;Database=aiep;Username=aiep_worker;Password=${AIEP_WORKER_PASSWORD:-worker_local_dev}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_SERVICE_NAME: aiep-worker
    depends_on:
      migrator:
        condition: service_completed_successfully

volumes:
  pgdata:
  azurite:
