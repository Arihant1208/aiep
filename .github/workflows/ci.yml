name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Restore
        run: dotnet restore Aiep.slnx
      - name: Scan for vulnerable NuGet packages
        # Belt-and-suspenders to the restore-time NuGet audit (CLAUDE.md): fail on any known-vulnerable package,
        # transitive ones included. `dotnet list` prints a report but always exits 0, so inspect its output.
        run: |
          dotnet list Aiep.slnx package --vulnerable --include-transitive 2>&1 | tee vulnerable-packages.txt
          if grep -q 'has the following vulnerable packages' vulnerable-packages.txt; then
            echo "::error::Vulnerable NuGet packages found. Upgrade them (never suppress)."
            exit 1
          fi
      - name: Check formatting
        run: dotnet format Aiep.slnx --verify-no-changes --no-restore
      - name: Build
        run: dotnet build Aiep.slnx -c Release --no-restore
      - name: Test
        run: dotnet test Aiep.slnx -c Release --no-build --logger trx --results-directory TestResults
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults

  containers:
    name: Compose and images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose file
        run: docker compose --profile app config --quiet
      - name: Build service images
        run: docker compose --profile app build
      - name: Install Trivy
        # Security scanners run at latest so they use the freshest advisory database.
        run: curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin
      - name: Scan images for vulnerabilities
        # Fail only on fixable HIGH/CRITICAL findings in our own images, so the gate is actionable.
        run: |
          for image in aiep-migrator aiep-api aiep-worker; do
            echo "::group::Trivy $image"
            trivy image --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed --no-progress "$image:local"
            echo "::endgroup::"
          done
